{% extends "admin/layout.html" %}

{% block title %}Create Prescription - Sahara Hospital ERP{% endblock %}

{% block admin_content %}
<div class="row align-items-center mb-4">
    <div class="col">
        <h3 class="mb-1 fw-bold text-dark">Create Prescription</h3>
        <p class="text-muted mb-0">Add new prescription to the system</p>
    </div>
    <div class="col-auto">
        <a href="{{ url_for('prescriptions.index') }}" class="btn btn-outline-primary">
            <i class="fas fa-arrow-left me-2"></i>Back to Prescriptions
        </a>
    </div>
</div>

        <div class="glass-card animate-on-scroll fade-in-up">
            <form method="POST">
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label">Patient *</label>
                        <select name="patient_id" class="form-select" required>
                            <option value="">Select Patient</option>
                            {% for patient in patients %}
                            <option value="{{ patient.id }}">{{ patient.full_name }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Linked OPD Visit</label>
                        <select name="opd_visit_id" class="form-select">
                            <option value="">Select OPD Visit (Optional)</option>
                            {% for visit in opd_visits %}
                            <option value="{{ visit.id }}">Token #{{ visit.token_number }} - {{ visit.patient.full_name }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="col-12">
                        <label class="form-label">Diagnosis *</label>
                        <textarea name="diagnosis" class="form-control" rows="3" required placeholder="Enter diagnosis"></textarea>
                    </div>
                    <div class="col-12">
                        <label class="form-label">Notes</label>
                        <textarea name="notes" class="form-control" rows="2" placeholder="Additional notes"></textarea>
                    </div>
                    
                    <div class="col-12">
                        <hr>
                        <h5>Medicines</h5>
                        <div id="medicines-container">
                            <div class="medicine-row mb-3 p-3 border rounded">
                                <div class="row g-2">
                                    <div class="col-md-3">
                                        <input type="text" name="medicine_name[]" class="form-control" placeholder="Medicine Name">
                                    </div>
                                    <div class="col-md-2">
                                        <input type="text" name="dosage[]" class="form-control" placeholder="Dosage">
                                    </div>
                                    <div class="col-md-2">
                                        <input type="text" name="frequency[]" class="form-control" placeholder="Frequency">
                                    </div>
                                    <div class="col-md-2">
                                        <input type="text" name="duration[]" class="form-control" placeholder="Duration">
                                    </div>
                                    <div class="col-md-3">
                                        <input type="text" name="instructions[]" class="form-control" placeholder="Instructions">
                                    </div>
                                </div>
                            </div>
                        </div>
                        <button type="button" class="btn btn-outline-primary btn-sm" onclick="addMedicineRow()">
                            <i class="fas fa-plus me-2"></i>Add Medicine
                        </button>
                    </div>
                    
                    <div class="col-12">
                        <button type="submit" class="btn btn-primary">
                            <i class="fas fa-save me-2"></i>Create Prescription
                        </button>
                    </div>
                </div>
            </form>
        </div>

<style>
.glass-card {
    background: rgba(255, 255, 255, 0.7);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255, 255, 255, 0.3);
    border-radius: 16px;
    padding: 1.5rem;
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.05);
}

@keyframes fade-in-up {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
}

.animate-on-scroll {
    opacity: 0;
}

.animate-on-scroll.animated {
    animation: fade-in-up 0.5s ease-out forwards;
}
</style>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const animatedElements = document.querySelectorAll('.animate-on-scroll');
    const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
            if (entry.isIntersecting) {
                entry.target.classList.add('animated');
            }
        });
    }, { threshold: 0.1 });
    animatedElements.forEach(el => observer.observe(el));
});

function addMedicineRow() {
    const container = document.getElementById('medicines-container');
    const newRow = document.createElement('div');
    newRow.className = 'medicine-row mb-3 p-3 border rounded';
    newRow.innerHTML = `
        <div class="row g-2">
            <div class="col-md-3">
                <input type="text" name="medicine_name[]" class="form-control" placeholder="Medicine Name">
            </div>
            <div class="col-md-2">
                <input type="text" name="dosage[]" class="form-control" placeholder="Dosage">
            </div>
            <div class="col-md-2">
                <input type="text" name="frequency[]" class="form-control" placeholder="Frequency">
            </div>
            <div class="col-md-2">
                <input type="text" name="duration[]" class="form-control" placeholder="Duration">
            </div>
            <div class="col-md-3">
                <input type="text" name="instructions[]" class="form-control" placeholder="Instructions">
            </div>
        </div>
    `;
    container.appendChild(newRow);
}
</script>
{% endblock %}
