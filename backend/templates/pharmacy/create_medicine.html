{% extends 'admin/layout.html' %}
{% block content %}
<h2>Add Medicine</h2>
<form method="post">
  <div class="form-group">
    <label for="medicine_name">Medicine Name</label>
    <input type="text" name="medicine_name" id="medicine_name" class="form-control" required>
  </div>
  <div class="form-group">
    <label for="category">Category</label>
    <input type="text" name="category" id="category" class="form-control" required>
  </div>
  <div class="form-group">
    <label for="dosage_form">Dosage Form</label>
    <input type="text" name="dosage_form" id="dosage_form" class="form-control">
  </div>
  <div class="form-group">
    <label for="manufacturer">Manufacturer</label>
    <input type="text" name="manufacturer" id="manufacturer" class="form-control">
  </div>
  <div class="form-group">
    <label for="min_stock">Minimum Stock</label>
    <input type="number" name="min_stock" id="min_stock" class="form-control" value="10" min="0">
  </div>
  <div class="form-group">
    <label for="unit">Unit</label>
    <input type="text" name="unit" id="unit" class="form-control" value="Tablet">
  </div>
  <button type="submit" class="btn btn-primary">Add Medicine</button>
</form>
{% endblock %}
