{% extends "admin/layout.html" %}

{% block title %}Patient Check-in - Sahara Hospital ERP{% endblock %}

{% block admin_content %}
<div class="row align-items-center mb-4">
    <div class="col">
        <h3 class="mb-1 fw-bold text-dark">Patient Check-in</h3>
        <p class="text-muted mb-0">Register new patient visits</p>
    </div>
    <div class="col-auto">
        <a href="{{ url_for('opd.dashboard') }}" class="btn btn-outline-primary">
            <i class="fas fa-arrow-left me-2"></i>Back to Dashboard
        </a>
    </div>
</div>

        <div class="glass-card animate-on-scroll fade-in-up">
            <form method="POST">
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label">Select Patient *</label>
                        <select name="patient_id" class="form-select" required>
                            <option value="">Choose Patient</option>
                            {% for patient in patients %}
                            <option value="{{ patient.id }}">{{ patient.full_name }} ({{ patient.email }})</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Select Doctor *</label>
                        <select name="doctor_id" class="form-select" required>
                            <option value="">Choose Doctor</option>
                            {% for doctor in doctors %}
                            <option value="{{ doctor.id }}">{{ doctor.name }} - {{ doctor.specialization }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="col-12">
                        <label class="form-label">Chief Complaint *</label>
                        <textarea name="chief_complaint" class="form-control" rows="3" required placeholder="Describe the patient's chief complaint"></textarea>
                    </div>
                    <div class="col-12">
                        <button type="submit" class="btn btn-primary">
                            <i class="fas fa-user-check me-2"></i>Check-in Patient
                        </button>
                    </div>
                </div>
            </form>
        </div>

<style>
.glass-card {
    background: rgba(255, 255, 255, 0.7);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255, 255, 255, 0.3);
    border-radius: 16px;
    padding: 1.5rem;
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.05);
}

@keyframes fade-in-up {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
}

.animate-on-scroll {
    opacity: 0;
}

.animate-on-scroll.animated {
    animation: fade-in-up 0.5s ease-out forwards;
}
</style>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const animatedElements = document.querySelectorAll('.animate-on-scroll');
    const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
            if (entry.isIntersecting) {
                entry.target.classList.add('animated');
            }
        });
    }, { threshold: 0.1 });
    animatedElements.forEach(el => observer.observe(el));
});
</script>
{% endblock %}
