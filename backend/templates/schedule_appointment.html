{% extends "base.html" %}

{% block title %}Schedule Appointment{% endblock %}

{% block content %}

<div class="container mt-5">

    <div class="card shadow-lg border-0">

        <div class="card-header bg-primary text-white">

            <h3>
                Schedule Appointment
            </h3>

        </div>

        <div class="card-body">

            <h5 class="mb-4">

                Patient:
                {{ appointment.patient.full_name }}

            </h5>

            <form method="POST">

                <div class="mb-3">

                    <label class="form-label">

                        Appointment Date

                    </label>

                    <input
                        type="date"
                        name="appointment_date"
                        class="form-control"
                        required>

                </div>

                <div class="mb-3">

                    <label class="form-label">

                        Appointment Time

                    </label>

                    <input
                        type="time"
                        name="appointment_time"
                        class="form-control"
                        required>

                </div>

                <button
                    type="submit"
                    class="btn btn-success">

                    Save Schedule

                </button>

            </form>

        </div>

    </div>

</div>

{% endblock %}
